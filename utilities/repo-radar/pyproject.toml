[project]
name = "repo-radar"
version = "0.1.0"
description = "Dashboard of local git repos: purpose, dev stage, sync state, and open PRs."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.scripts]
repo-radar = "repo_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplification
    "PTH",       # use pathlib
    "RET",       # return consistency
    "ARG",       # unused arguments
    "S",         # bandit security rules
    "T20",       # no print
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "ARG"]
"src/*/cli.py" = ["T20"]
# Both modules shell out to fixed argv lists (never shell=True) on purpose:
# git and gh are the data sources.
"src/*/gitinfo.py" = ["S603", "S607"]
"src/*/github.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
