# Example config.json file:
{
  "graphql": {
    "api_url": "https://api.example.com/graphql",
    "query_file": "queries/get_user.graphql",
    "headers": {
      "Authorization": "Bearer your_token_here"
    }
  },
  "variables": {
    "userId": "123",
    "limit": 10,
    "includeDetails": true
  },
  "log_analytics": {
    "workspace_id": "your-workspace-id",
    "shared_key": "your-shared-key",
    "log_type": "GraphQLData"
  }
}

# Example config.ini file:
[graphql]
api_url = https://api.example.com/graphql
query_file = queries/get_user.graphql
headers = {"Authorization": "Bearer your_token_here"}

[variables]
userId = 123
limit = 10
includeDetails = true

[log_analytics]
workspace_id = your-workspace-id
shared_key = your-shared-key
log_type = GraphQLData

# Example GraphQL query file (queries/get_user.graphql):
query GetUser($userId: ID!, $limit: Int, $includeDetails: Boolean!) {
  user(id: $userId) {
    id
    name
    email
    posts(limit: $limit) @include(if: $includeDetails) {
      id
      title
      content
    }
  }
}